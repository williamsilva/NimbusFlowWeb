<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="NimbusFlow">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#g)" filter="url(#s)"/>

  <!-- control dial -->
  <path d="M42.8,76.2 A30,30 0 1 1 85.2,76.2" fill="none" stroke="#e0f2fe" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
  <line x1="64" y1="55" x2="78.1" y2="40.9" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="64" cy="55" r="5" fill="#ffffff"/>

  <!-- NF monogram -->
  <text x="64" y="103" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="24" font-weight="800" fill="#ffffff">NF</text>
</svg>
