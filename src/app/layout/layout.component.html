<app-topbar class="topbar-wrapper"></app-topbar>

<div class="shell" [class.sidebar-collapsed]="!sidebarVisible()">
  @if (sidebarVisible()) {
    <!-- No mobile (ver CSS) isto vira um overlay de tela cheia, não uma coluna do grid - o
         fundo escurecido abaixo só existe/aparece nesse breakpoint (display:none no desktop). -->
    <div class="sidebar-backdrop" (click)="closeSidebarOverlay()"></div>
    <app-sidebar class="sidebar-host"></app-sidebar>
  }

  <main class="content">
    <div class="content-inner cs-glass">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-footer class="footer-fixed" [class.sidebar-collapsed]="!sidebarVisible()"></app-footer>

<app-bottom-nav></app-bottom-nav>
