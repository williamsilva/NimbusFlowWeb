<aside class="sidebar glass">
  <nav class="nav">
    @for (item of visibleNavItems; track item.labelKey) {
      @if (item.children) {
        <div class="nav-group-label">
          <i class="nav-icon" [class]="item.icon"></i>
          <span class="nav-label">{{ item.labelKey | translate }}</span>
        </div>
        @for (child of item.children; track child.link) {
          <a
            class="nav-item nav-item--child"
            [routerLink]="child.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: !!child.exact }"
          >
            <i class="nav-icon" [class]="child.icon"></i>
            <span class="nav-label">{{ child.labelKey | translate }}</span>
          </a>
        }
      } @else {
        <a
          class="nav-item"
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <i class="nav-icon" [class]="item.icon"></i>
          <span class="nav-label">{{ item.labelKey | translate }}</span>
        </a>
      }
    }
  </nav>

  <div class="sidebar-profile">
    <div class="profile-card">
      <div class="avatar">
        <span class="avatar-text">{{ initials }}</span>
      </div>

      <div class="profile-info">
        <div class="profile-name" [title]="currentUser?.name || ''">{{ currentUser?.name }}</div>
      </div>

      <button
        pButton
        [text]="true"
        type="button"
        class="logout"
        (click)="logout.emit()"
        [attr.aria-label]="'menu.logout' | translate"
        [pTooltip]="'menu.logout' | translate"
      >
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </div>
</aside>
