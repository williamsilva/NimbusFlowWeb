<div class="page-container">
  <div class="page-header">
    <h2>{{ 'measurements.form.title' | translate }}</h2>
  </div>

  @if (supersedesId) {
    <p>{{ 'measurements.form.resubmitNotice' | translate }}</p>
  }

  <div class="content-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <p-floatlabel variant="on">
        <textarea pTextarea id="description" formControlName="description" required rows="3"></textarea>
        <label for="description">{{ 'measurements.form.description' | translate }}</label>
      </p-floatlabel>

      <h4>{{ 'measurements.form.geolocationTitle' | translate }}</h4>
      <button pButton severity="secondary" [outlined]="true" type="button" (click)="captureLocation()">{{ 'measurements.form.captureLocation' | translate }}</button>
      @if (locationError) {
        <p class="error">{{ locationError }}</p>
      }

      <p-floatlabel variant="on">
        <input pInputText id="latitude" [value]="form.controls.latitude.value" disabled />
        <label for="latitude">{{ 'measurements.form.latitude' | translate }}</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText id="longitude" [value]="form.controls.longitude.value" disabled />
        <label for="longitude">{{ 'measurements.form.longitude' | translate }}</label>
      </p-floatlabel>

      <h4>{{ 'measurements.form.mediaTitle' | translate }}</h4>
      <input type="file" multiple accept="image/*,video/*" (change)="onFilesSelected($event)" />

      <div class="actions">
        <button pButton type="submit">{{ 'measurements.form.submit' | translate }}</button>
      </div>
    </form>
  </div>
</div>
