<form [formGroup]="form" class="dialog-form">
  <p-floatlabel variant="on">
    <textarea pTextarea id="description" formControlName="description" required rows="4" style="width: 100%"></textarea>
    <label for="description">{{ 'suggestions.form.description' | translate }}</label>
  </p-floatlabel>
  @if (form.controls.description.touched && form.controls.description.hasError('required')) {
    <small class="field-error">{{ 'suggestions.form.descriptionRequired' | translate }}</small>
  }

  <h4>{{ 'suggestions.form.attachmentOptional' | translate }}</h4>
  <input type="file" (change)="onFileSelected($event)" />

  <div class="dialog-actions">
    <button pButton type="button" severity="secondary" [outlined]="true" (click)="cancel()" [disabled]="saving">{{ 'common.cancel' | translate }}</button>
    <button pButton type="button" (click)="save()" [disabled]="saving">
      {{ (saving ? 'suggestions.form.sending' : 'suggestions.form.send') | translate }}
    </button>
  </div>
</form>
