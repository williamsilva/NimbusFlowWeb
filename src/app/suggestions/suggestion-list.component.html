<div class="page-header">
  <h2>Sugestões de melhoria</h2>
  <a mat-raised-button color="primary" routerLink="/suggestions/new">Nova sugestão</a>
</div>

<div class="table-container">
  <table mat-table [dataSource]="suggestions">
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let s">{{ s.description }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let s">
        @if (canManage()) {
          <mat-select [value]="s.status" (selectionChange)="changeStatus(s, $event.value)">
            @for (status of statusOptions; track status) {
              <mat-option [value]="status">{{ status }}</mat-option>
            }
          </mat-select>
        } @else {
          {{ s.status }}
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="attachment">
      <th mat-header-cell *matHeaderCellDef>Anexo</th>
      <td mat-cell *matCellDef="let s">
        @if (s.attachmentUrl) {
          <a [href]="s.attachmentUrl" target="_blank" rel="noopener">Ver anexo</a>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="createdBy">
      <th mat-header-cell *matHeaderCellDef>Autor</th>
      <td mat-cell *matCellDef="let s">{{ s.createdById }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
