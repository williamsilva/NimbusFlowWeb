<app-topbar
  class="topbar-wrapper"
  [currentUser]="currentUser"
  [sidebarVisible]="sidebarVisible()"
  (toggleSidebar)="toggleSidebar()"
  (login)="login()"
  (logout)="logout()"
></app-topbar>

<div class="shell" [class.sidebar-collapsed]="!sidebarVisible() || !currentUser?.authenticated">
  @if (currentUser?.authenticated && sidebarVisible()) {
    <app-sidebar class="sidebar-host" [currentUser]="currentUser" (logout)="logout()"></app-sidebar>
  }

  <main class="content">
    <div class="content-inner">
      <router-outlet />
    </div>
  </main>
</div>

<app-footer
  class="footer-fixed"
  [class.sidebar-collapsed]="!sidebarVisible() || !currentUser?.authenticated"
></app-footer>
