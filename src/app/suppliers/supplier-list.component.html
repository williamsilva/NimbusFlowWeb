<div class="page-container">
  <div class="page-header">
    <h2>Fornecedores</h2>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Novo fornecedor
    </button>
  </div>

  <mat-card class="content-card">
    <div class="list-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="search" placeholder="Razão social, CNPJ/CPF, e-mail…" />
      </mat-form-field>

      <button mat-icon-button (click)="load()" aria-label="Atualizar" matTooltip="Atualizar">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="filteredSuppliers">
        <ng-container matColumnDef="companyName">
          <th mat-header-cell *matHeaderCellDef>Razão social</th>
          <td mat-cell *matCellDef="let supplier">{{ supplier.companyName }}</td>
        </ng-container>

        <ng-container matColumnDef="taxId">
          <th mat-header-cell *matHeaderCellDef>CNPJ/CPF</th>
          <td mat-cell *matCellDef="let supplier">{{ supplier.taxId }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let supplier">{{ supplier.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-mail</th>
          <td mat-cell *matCellDef="let supplier">{{ supplier.email }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let supplier">
            <app-status-badge
              [label]="supplier.active ? 'Ativo' : 'Inativo'"
              [tone]="supplier.active ? 'success' : 'neutral'"
            ></app-status-badge>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let supplier">
            <button mat-icon-button (click)="openEdit(supplier)" aria-label="Editar" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            @if (supplier.active) {
              <button
                mat-icon-button
                (click)="deactivate(supplier)"
                aria-label="Desativar"
                matTooltip="Desativar"
              >
                <mat-icon>block</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      @if (filteredSuppliers.length === 0) {
        <div class="empty-state">Nenhum fornecedor encontrado.</div>
      }
    </div>
  </mat-card>
</div>
