<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '420px', maxWidth: '95vw' }"
  [header]="i18n.tUi('paymentOrders.sendDialog.header')"
>
  @if (target(); as target) {
    <p class="mb-3">
      {{
        i18n.tUi('paymentOrders.sendDialog.message', {
          count: target.orderCount,
          supplier: target.supplierName,
          total: (target.totalAmount | csCurrency),
        })
      }}
    </p>
  }

  <div class="flex align-items-center gap-2 flex-wrap">
    <input #invoiceInput type="file" accept="application/pdf" hidden (change)="onInvoiceSelected($event)" />
    <button
      pButton
      type="button"
      icon="pi pi-paperclip"
      class="p-button-text p-button-sm"
      [label]="'paymentOrders.sendDialog.attachInvoice' | translate"
      (click)="invoiceInput.click()"
    ></button>
  </div>
  @if (invoice(); as invoice) {
    <div class="flex align-items-center gap-2 flex-wrap mt-2">
      <p-chip [label]="invoice.name" [removable]="true" (onRemove)="removeInvoice()"></p-chip>
    </div>
  }

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      (click)="cancel()"
      icon="pi pi-times"
      class="p-button-text p-button-sm"
      [label]="'common.cancel' | translate"
    ></button>

    <button
      pButton
      type="button"
      (click)="confirm()"
      icon="pi pi-send"
      class="p-button-sm"
      [loading]="sending()"
      [label]="'paymentOrders.send' | translate"
    ></button>
  </ng-template>
</p-dialog>
