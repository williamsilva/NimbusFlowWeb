<app-page-header
  [subtitle]="'workAutoComplete.settings.subtitle' | translate"
  [breadcrumb]="[
    { label: ('menu.settings.title' | translate), url: '/settings' },
    { label: ('routes.settings.workAutoComplete.title' | translate) },
  ]"
></app-page-header>

@if (canViewWork()) {
  <p-card
    class="mt-2 block"
    [header]="'workAutoComplete.settings.cardTitle' | translate"
    [subheader]="'workAutoComplete.settings.cardSubtitle' | translate"
  >
    <form [formGroup]="workForm" (ngSubmit)="saveWork()">
      <div class="grid formgrid gap-0">
        <div class="col-12 md:col-4 p-2">
          <p-floatLabel variant="on" class="w-full">
            <p-inputnumber
              [min]="0"
              [max]="365"
              class="w-full"
              inputId="workDaysSinceLastPayment"
              [useGrouping]="false"
              inputStyleClass="w-full p-inputtext-sm"
              formControlName="daysSinceLastPayment"
            ></p-inputnumber>
            <label for="workDaysSinceLastPayment">
              {{ 'workAutoComplete.settings.daysSinceLastPayment' | translate }}
              <i
                class="pi pi-info-circle text-xs ml-1 text-color-secondary cursor-pointer"
                style="pointer-events: auto"
                [pTooltip]="'workAutoComplete.settings.daysSinceLastPaymentHint' | translate"
                tooltipPosition="top"
              ></i>
            </label>
          </p-floatLabel>
        </div>

        <div class="col-12 md:col-4 p-2">
          <p-floatLabel variant="on" class="w-full">
            <p-inputnumber
              [min]="0"
              [max]="23"
              class="w-full"
              inputId="workRunHour"
              [useGrouping]="false"
              inputStyleClass="w-full p-inputtext-sm"
              formControlName="runHour"
            ></p-inputnumber>
            <label for="workRunHour">
              {{ 'workAutoComplete.settings.runHour' | translate }}
              <i
                class="pi pi-info-circle text-xs ml-1 text-color-secondary cursor-pointer"
                style="pointer-events: auto"
                [pTooltip]="'workAutoComplete.settings.runHourHint' | translate"
                tooltipPosition="top"
              ></i>
            </label>
          </p-floatLabel>
        </div>

        <div class="col-12 md:col-4 p-2">
          <p-floatLabel variant="on" class="w-full">
            <p-inputnumber
              [min]="0"
              [max]="59"
              class="w-full"
              inputId="workRunMinute"
              [useGrouping]="false"
              inputStyleClass="w-full p-inputtext-sm"
              formControlName="runMinute"
            ></p-inputnumber>
            <label for="workRunMinute">
              {{ 'workAutoComplete.settings.runMinute' | translate }}
              <i
                class="pi pi-info-circle text-xs ml-1 text-color-secondary cursor-pointer"
                style="pointer-events: auto"
                [pTooltip]="'workAutoComplete.settings.runMinuteHint' | translate"
                tooltipPosition="top"
              ></i>
            </label>
          </p-floatLabel>
        </div>
      </div>

      @if (canEditWork()) {
        <div class="mt-4 px-2">
          <p-button
            type="submit"
            icon="pi pi-save"
            [loading]="savingWork()"
            [label]="'common.save' | translate"
            [disabled]="loadingWork() || workForm.invalid"
          ></p-button>
        </div>
      }
    </form>
  </p-card>
}
