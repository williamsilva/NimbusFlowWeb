<app-page-header
  [subtitle]="'taskLocations.subtitle' | translate"
  [breadcrumb]="[
    { label: ('menu.settings.title' | translate), url: '/settings' },
    { label: ('routes.settings.taskLocations.title' | translate) },
  ]"
>
  <button
    pButton
    type="button"
    (click)="goNew()"
    icon="pi pi-plus"
    tooltipPosition="top"
    [disabled]="!canChange()"
    class="p-button-info p-button-sm"
    [label]="'taskLocations.new.title' | translate"
    [pTooltip]="!canChange() ? ('taskLocations.action.noPermission' | translate) : ''"
  ></button>
</app-page-header>

<app-task-location-form-dialog
  [editing]="editing()"
  [visible]="formVisible()"
  (visibleChange)="onFormVisibleChange($event)"
></app-task-location-form-dialog>

<div class="surface-card border-round px-3 pt-2 pb-3 mt-2">
  <p-table
    stripedRows
    dataKey="id"
    size="small"
    showGridlines
    [value]="items()"
    [rowHover]="true"
    [loading]="loading()"
    class="cs-admin-table"
  >
    <ng-template pTemplate="colgroup">
      <colgroup>
        <col style="width: auto" />
        <col style="width: 70px" />
      </colgroup>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th>
          <span class="th-label" tooltipPosition="top" [pTooltip]="'taskLocations.columns.name' | translate">{{
            'taskLocations.columns.name' | translate
          }}</span>
        </th>
        <th class="text-center">
          <span class="th-label" tooltipPosition="top" [pTooltip]="'common.actions' | translate">{{
            'common.actions' | translate
          }}</span>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td class="mobile-card-title">
          <span class="cs-table-cell-ellipsis" tooltipPosition="top" [pTooltip]="row.name">{{ row.name }}</span>
        </td>
        <td class="text-center mobile-card-actions">
          <div class="table-actions">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              (click)="goEdit(row)"
              tooltipPosition="top"
              [disabled]="!canChange()"
              class="p-button-text p-button-sm"
              [pTooltip]="
                canChange()
                  ? ('common.edit' | translate)
                  : ('taskLocations.action.noPermission' | translate)
              "
              [attr.aria-label]="
                canChange()
                  ? ('common.edit' | translate)
                  : ('taskLocations.action.noPermission' | translate)
              "
            ></button>

            <button
              pButton
              type="button"
              icon="pi pi-trash"
              tooltipPosition="top"
              [disabled]="!canChange()"
              (click)="confirmDelete(row)"
              class="p-button-text p-button-sm p-button-danger"
              [pTooltip]="
                canChange()
                  ? ('common.delete' | translate)
                  : ('taskLocations.action.noPermission' | translate)
              "
              [attr.aria-label]="
                canChange()
                  ? ('common.delete' | translate)
                  : ('taskLocations.action.noPermission' | translate)
              "
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" class="text-center py-5 opacity-70">
          {{
            loadedOnce()
              ? ('taskLocations.empty.title' | translate)
              : ('common.loading' | translate)
          }}
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
