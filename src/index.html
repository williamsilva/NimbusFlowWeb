<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flow</title>
    <base href="/" />
    <!-- viewport-fit=cover: deixa a página se estender por trás do notch/status bar (iOS) -
         sem isso o safe-area-inset-* fica sempre 0 e a barra de status vira uma faixa branca
         "de site", não a cor do app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/nimbusflow-mark.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <meta name="theme-color" content="#7c3aed" />
    <!-- iOS não usa manifest.display/theme_color pra decidir isso (só Android/Chrome) - precisa
         desses 3 à parte pra instalar "sem cara de Safari" e colorir a área da status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
